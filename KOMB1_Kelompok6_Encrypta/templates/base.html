<!DOCTYPE html>
<html>
<head>
    <title>Crypto File Tool</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            margin: 0;
        }

        nav {
            background: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #4CAF50;
        }

        .container {
            text-align: center;
            margin-top: 60px;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input, button {
            margin: 10px;
            padding: 10px;
            width: 90%;
        }

        .encrypt { background: #4CAF50; color: white; }
        .decrypt { background: #f44336; color: white; }

        .alert {
            color: green;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/encrypt">Encrypt</a>
    <a href="/decrypt">Decrypt</a>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
