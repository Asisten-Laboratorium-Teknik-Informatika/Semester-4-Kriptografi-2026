{% extends "base.html" %}

{% block content %}
<div class="box">
    <h2>🔓 Decrypt File</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form action="/process" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <input type="password" name="password" placeholder="Masukkan Key" required>
        <button type="submit" name="action" value="decrypt" class="decrypt">
            Decrypt
        </button>
    </form>
</div>
{% endblock %}
