<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat - Login</title>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.51/build/spline-viewer.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <!-- Spline 3D Ambient Background (Removed due to 403 error) -->

    <div class="glass-container" id="auth-container">
        <h1 id="auth-title">Masuk Akun</h1>
        
        <div id="error-msg" style="color: #e74c3c; font-size: 13px; text-align: center; display: none;"></div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label for="username">Nama Pengguna</label>
                <input type="text" id="username" required placeholder="Masukkan nama pengguna...">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" required placeholder="Masukkan kata sandi...">
            </div>
            
            <button type="submit" style="margin-top: 25px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;">
                <i data-feather="log-in"></i> <span id="auth-btn-text">Masuk</span>
            </button>
        </form>

        <div class="switch-auth">
            <span id="auth-switch-desc">Belum punya akun?</span> 
            <a href="#" onclick="toggleAuthMode(event)" id="auth-switch-link">Daftar sekarang</a>
        </div>
    </div>

    <script>
        feather.replace();
    </script>
    <script type="module">
        import { animate } from 'https://cdn.jsdelivr.net/npm/animejs@4.4.1/+esm';
        
        // Animasi masuk untuk panel dengan Anime.js V4
        animate('#auth-container', {
            y: [50, 0],
            opacity: [0, 1],
            duration: 1000,
            ease: 'outElastic(1, .8)'
        });
        
        // Menyimpan instance anime di window jika diperlukan oleh app.js
        window.animate = animate;
    </script>
    <script src="/static/js/app.js"></script>
</body>
</html>
